name: Deploy Auto Scaler

on:
  workflow_run:
    workflows: ["K3s deployment using Ansible"]
    types:
      - completed

  workflow_dispatch:

jobs:
  deploy-asg-and-workers:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m venv infra/venv
          
          # Call pip directly from the venv folder
          infra/venv/bin/pip install --upgrade pip
          infra/venv/bin/pip install -r infra/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi login

      - name: Prepare Lambda Dependencies
        run: |
          cd functions/smart-scaler
          # Use the official AWS Lambda Python 3.11 image to build dependencies
          # This ensures the compiled binaries (like cryptography) match the Lambda OS
          docker run --rm -v $(pwd):/var/task public.ecr.aws/sam/build-python3.11:latest \
            pip install -r requirements.txt -t ./src/
          
          # Optional: Clean up __pycache__ and dist-info to save space
          find ./src -type d -name "__pycache__" -exec rm -rf {} +
          find ./src -type d -name "*.dist-info" -exec rm -rf {} +

      - name: Pulumi Sync and Deploy - Autoscaler
        env:
          PULUMI_PYTHON_CMD: ../../venv/bin/python
        run: |
          pulumi stack select dev --create --cwd infra/k3s-cluster/worker
          pulumi refresh --yes --cwd infra/k3s-cluster/worker
          pulumi up --yes --cwd infra/k3s-cluster/worker
