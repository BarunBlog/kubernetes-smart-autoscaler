name: Deploy Smart Scaler to Lambda
on:
  push:
    branches:
      - master
    paths:
      - functions/smart-scaler/**

  workflow_dispatch:

jobs:
  deploy-smart-scaler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Prepare Lambda Dependencies
        run: |
          cd functions/smart-scaler

          # Install dependencies using a Lambda-compliant OS (Amazon Linux 2023)
          # We use the 'root' user inside Docker to install into the mounted /var/task
          docker run --rm -v $(pwd):/var/task public.ecr.aws/sam/build-python3.11:latest \
            pip install -r requirements.txt -t ./src/

          # FIX PERMISSIONS
          # Reclaim ownership of the files from the 'root' docker user
          sudo chown -R $USER:$USER ./src

          # PRODUCTION CLEANUP
          # Remove compilation artifacts and metadata that aren't needed at runtime
          find ./src -type d -name "__pycache__" -exec rm -rf {} +
          find ./src -type d -name "*.dist-info" -exec rm -rf {} +
          find ./src -type d -name "*.egg-info" -exec rm -rf {} +

          # Final check: Ensure the folder is clean but contains the libs
          ls -F ./src

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Zip Bundle
        run: |
          cd functions/smart-scaler/src
          zip -r ../../../deploy.zip .

      - name: Pulumi login
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        run: pulumi login

      - name: Pulumi Refresh - Autoscaler
        run: |
          pulumi stack select dev --cwd infra/k3s-cluster/worker
          pulumi refresh --yes --cwd infra/k3s-cluster/worker

      - name: Save Pulumi outputs
        id: pulumi_outputs
        run: |
          LAMBDA_FUNCTION_NAME=$(pulumi stack output lambda_function_name --cwd infra/k3s-cluster/worker -s dev)
          
          echo "LAMBDA_FUNCTION_NAME=$LAMBDA_FUNCTION_NAME" >> $GITHUB_ENV
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://deploy.zip