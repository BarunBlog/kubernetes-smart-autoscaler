---
- name: Download and install k3s
  shell: |
    curl -sfL https://get.k3s.io | sh -

- name: Set file permission
  shell: |
    sudo chmod 644 /etc/rancher/k3s/k3s.yaml

- name: Get k3s token
  shell: "cat /var/lib/rancher/k3s/server/node-token"
  register: k3s_token
  changed_when: false

- name: Get master node IP
  shell: "hostname -I | awk '{print $1}'"
  register: master_ip
  changed_when: false

- name: Upload Cluster Info to S3 for Autoscaler
  shell: |
    echo "{{ master_ip.stdout }}|{{ k3s_token.stdout }}" > /tmp/cluster_info
    /usr/local/bin/aws s3 cp /tmp/cluster_info "s3://{{ s3_bucket_name }}/cluster_info"

- name: Prepare Kubeconfig for Autoscaler
  shell: |
    # Copy the kube config to a temp location
    cp /etc/rancher/k3s/k3s.yaml /tmp/k3s-autoscaler.yaml
    # Replace localhost with the Master's Private IP so Lambda can connect
    sed -i "s/127.0.0.1/{{ master_ip.stdout }}/g" /tmp/k3s-autoscaler.yaml
    chmod 644 /tmp/k3s-autoscaler.yaml

- name: Upload Cluster Info and Kubeconfig to S3
  shell: |
    echo "{{ master_ip.stdout }}|{{ k3s_token.stdout }}" > /tmp/cluster_info
    /usr/local/bin/aws s3 cp /tmp/cluster_info "s3://{{ s3_bucket_name }}/cluster_info"
    /usr/local/bin/aws s3 cp /tmp/k3s-autoscaler.yaml "s3://{{ s3_bucket_name }}/kubeconfig"

- name: Cleanup temporary files on Master
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /tmp/cluster_info
    - /tmp/k3s-autoscaler.yaml